name: Simplify project milestones
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-project-plan.yml'
permissions:
  contents: read
  issues: write
jobs:
  simplify:
    if: github.repository == 'hamzi802/udp-p2p-group-communication' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Rename three active milestones and archive two old ones
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          base = "https://api.github.com/repos/hamzi802/udp-p2p-group-communication"
          headers = {
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "cn-simplify-milestones",
          }

          def request(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              with urlopen(Request(base + path, data=data, method=method, headers=headers), timeout=30) as response:
                  return json.load(response)

          stages = {
              3: ("Step 1 — Build separately", "Each member finishes a standalone demo using fake peers/messages or local files. No teammate's code is needed."),
              4: ("Step 2 — Connect parts", "After all four demos, connect UDP, peer chat, file storage and downloads in the same app."),
              5: ("Step 3 — Demonstrate and report", "Run the same app on four computers, show eight files, departure, a fifth peer and download failover; record results."),
          }
          for number, (title, description) in stages.items():
              current = request("GET", f"/milestones/{number}")
              wanted = {"title": title, "description": description + " Proposed internal date, not the instructor deadline.", "state": "open"}
              if any(current.get(key) != value for key, value in wanted.items()):
                  request("PATCH", f"/milestones/{number}", wanted)
          for number in (1, 2):
              current = request("GET", f"/milestones/{number}")
              if current["state"] != "closed":
                  request("PATCH", f"/milestones/{number}", {"state": "closed"})
          PY
